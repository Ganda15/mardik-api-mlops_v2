# Chaîne LLMOps — brique 11 (dernière).
#
# UN pipeline, pas deux — proposition de Steve, endossée par le formateur en classe le
# 18/09 (« pourquoi tu n'as pas pensé à ça plus tôt ») : agent et logiciel restent dans
# le même code, il n'y a pas deux composants déployables. Job 1 (tests, gratuit,
# MOCK=on) tourne à chaque push. Job 2 (le gate d'évaluation, payant) est filtré par
# chemin sur une PR (dorny/paths-filter@v4 — l'outil nommé par le formateur en classe) :
# seulement si models/v2/config.yaml, prompts/, le code du pipeline, ou le jeu de
# référence changent. À la fusion sur main, job 2 tourne SYSTÉMATIQUEMENT, sans
# condition : le code réellement fusionné peut différer de celui vu sur la PR
# (docs/spec-v2-perimetre.md §4.3, CONTINUITE.md §D ter).
#
# Pas de staging (Ch1 §3.4) : le canary sur trafic réel en tient lieu.
# surveiller() n'apparaît jamais ici : c'est un processus continu, pas une étape CI —
# juste après un déploiement canary, il n'y a encore aucun trafic à mesurer.
#
# Tout tourne avec MOCK=on : la CI ne doit ni payer ni dépendre du fournisseur. C'est
# une preuve de la MÉCANIQUE du gate (rappel, seuils, p95/coût calculés), pas des vrais
# chiffres — le vrai gate se joue en local (`make eval VERSION=v2`) avant de fusionner,
# avec le vrai modèle. Question encore ouverte (depuis la brique 1, non résolue ici) :
# contexte_max_caracteres (6000) tient-il le budget réel 8 s / 0,15 € ?
#
# Ce qui persiste après un run (22/09, avant le premier run réel — sans ça la chaîne
# était verte mais invisible après coup) : le tag git vX.Y.Z (source de vérité des
# versions : ops/registry/v2*/ est ignoré par git et n'existe jamais sur un runner
# neuf), l'image sur GHCR, et le registre (manifeste + index) en artefact de build,
# transmis du job publication au job canary — chaque job tourne sur un runner vierge.
#
# Équivalent local : `make ci`.

name: llmops

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Forcer la version publiée (sinon auto-calculée)"
        required: false
        default: ""

env:
  MOCK: "on"
  DRIFT: "off"
  LLM_PROVIDER: ollama
  LLM_MODEL: modele-ci

# Lecture seule par défaut ; seuls publication (tag) et build (GHCR) élèvent leurs droits.
permissions:
  contents: read

# Deux fusions rapprochées ne doivent pas calculer la même version : une seule chaîne
# à la fois par branche, sans annuler celle en cours.
concurrency:
  group: llmops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .

  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Tests d'intégration (hérités de la remédiation)
        run: uv run pytest -q tests/integration
      - name: Tests d'acceptance (le brief) + nos tests unitaires par brique
        run: uv run pytest -q

  filtre-chemins:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      gate: ${{ steps.filtre.outputs.gate }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtre
        with:
          filters: |
            gate:
              - 'models/v2/config.yaml'
              - 'prompts/**'
              - 'app/pipeline/**'
              - 'eval/attendus.jsonl'
              - 'eval/thresholds.yml'

  gate-evaluation:
    needs: [tests, filtre-chemins]
    # PR : seulement si le filtre de chemin a matché. Push (fusion sur main, ou tag) :
    # toujours, sans condition — le code fusionné peut différer de celui de la PR.
    if: github.event_name != 'pull_request' || needs.filtre-chemins.outputs.gate == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      note: ${{ steps.gate.outputs.note }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # historique complet : ops.registry.versions() doit voir tous les tags
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Gate d'évaluation (MOCK=on en CI — mécanique du gate, pas les vrais chiffres)
        id: gate
        run: uv run python -m eval.run_eval --version v2 --seuil 0.75
      - name: Prochaine version (MINOR si le filtre de chemin a matché, sinon PATCH)
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"   # un tag poussé à la main désigne sa propre version
          fi
          if [ -z "$VERSION" ]; then
            # Source de vérité : les tags git (d'où fetch-depth: 0), jamais les dossiers du
            # registre — ignorés par git, absents d'un runner neuf. v1 reste taguée pour
            # toujours : on ne bumpe que sur la ligne v2.x.x.
            DERNIERE=$(git tag -l 'v2.*' --sort=-v:refname | head -n 1)
            if [ -z "$DERNIERE" ]; then
              VERSION=v2.0.0
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${DERNIERE#v}"
              if [ "${{ needs.filtre-chemins.outputs.gate }}" = "true" ]; then
                VERSION="v${MAJOR}.$((MINOR + 1)).0"
              else
                VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
            fi
          fi
          echo "version calculée : $VERSION (dernier tag v2 : ${DERNIERE:-aucun})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publier le rapport du gate en artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report-${{ github.sha }}
          path: eval/history.jsonl

  build:
    needs: gate-evaluation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.gate-evaluation.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image de l'application, taguée avec la version calculée, poussée sur GHCR
        run: |
          # GHCR exige un nom en minuscules ; l'owner GitHub (Ganda15) ne l'est pas.
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          echo "image publiée : $IMAGE:$VERSION"

  publication:
    needs: [gate-evaluation, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour pousser le tag
    env:
      VERSION: ${{ needs.gate-evaluation.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Étiqueter la version dans le registre — REFUSE si le gate a échoué
        run: uv run python -m ops.deploy publier "$VERSION" --bundle v2 --seuil 0.75
      - name: Tag git — immuable (git refuse d'écraser un tag existant sans -f)
        run: |
          git config user.name "llmops[bot]"
          git config user.email "llmops@users.noreply.github.com"
          git tag -a "$VERSION" -m "Publié par llmops.yml : gate vert, commit ${GITHUB_SHA::7}"
          git push origin "refs/tags/$VERSION"
      - name: Registre publié en artefact (manifeste + index), transmis au job canary
        uses: actions/upload-artifact@v7
        with:
          name: registry-${{ needs.gate-evaluation.outputs.version }}
          path: ops/registry/
          if-no-files-found: error

  deploiement-canary:
    needs: [gate-evaluation, publication]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate-evaluation.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync
      # Runner vierge : sans le registre du job publication, definir_canary() refuserait
      # (« version inconnue du registre »). Constaté à la relecture du 22/09, jamais couru.
      - name: Registre tel que publié
        uses: actions/download-artifact@v8
        with:
          name: registry-${{ needs.gate-evaluation.outputs.version }}
          path: ops/registry/
      - name: Canary à 10 % — la promotion et le rollback restent hors CI
        run: |
          uv run python -m ops.deploy canary "$VERSION" --pourcentage 10
          cat ops/registry/index.json
      - name: Registre après canary (l'index dit qui sert quel trafic)
        uses: actions/upload-artifact@v7
        with:
          name: registry-${{ needs.gate-evaluation.outputs.version }}-canary
          path: ops/registry/
          if-no-files-found: error
      # La promotion (au vu des métriques réelles) et le rollback (décision humaine,
      # jamais automatique — CONTINUITE.md §D quater) se font depuis le tableau de bord
      # ou en CLI, pas depuis cette chaîne : la surveillance est un processus continu
      # sur du trafic réel, que la CI n'a pas au moment du déploiement.
