# Bundle v2 — la nouvelle version. Brique 1 du Chantier 1 (docs/spec-v2-perimetre.md §7.1).
#
# Même client LLM que la v1 (app/llm_client.py). Stratégie map-reduce par clauses, imposée par
# le dépôt (tests/acceptance/test_chaine.py::test_contrat_v2_long_analyse_sans_troncature,
# `sections > 1`) — la conception initiale (un seul appel long-contexte) est abandonnée ;
# voir CONTINUITE.md §D quater du dossier du brief pour la trace de ce changement.

version: v2.0.0
modele: ${LLM_MODEL}
strategie: map_reduce_clauses    # un appel par section (app/pipeline/), pas un appel par contrat

prompt: |
  Tu es un assistant juridique. On te donne le TITRE et le TEXTE d'une seule section d'un
  contrat commercial (pas le contrat entier). Identifie, dans cette section uniquement, les
  types de clauses présents parmi cette liste fermée : résiliation, pénalité de retard,
  confidentialité, propriété intellectuelle, limitation de responsabilité, force majeure,
  durée, prix et paiement, non-concurrence, garantie, données personnelles, droit applicable,
  exclusivité, reconduction tacite.
  Pour chaque type trouvé, cite l'extrait exact de la section qui le montre (copie littérale,
  jamais une paraphrase) et donne ta confiance entre 0 et 1. N'invente jamais un extrait absent
  du texte fourni. Si aucun type n'est présent dans cette section, réponds avec une liste vide.
  Réponds uniquement en JSON, sans texte autour, conforme au schéma fourni.

parametres:
  temperature: 0.2               # gate stable ; la séance du 16/09 a perdu 2h sur 0.7 par défaut
  max_tokens: 500                 # plusieurs clauses + extraits possibles par section
  seed: 42                        # figé, engagement de reproductibilité ; la variance résiduelle
                                   # (le fournisseur n'est pas garanti déterministe) est absorbée
                                   # par essais_eval, pas niée
  essais_eval: 3                  # moyenne sur 3 passes du gate — cf. Makefile ARGS="--essais 3"
  contexte_max_caracteres: 6000   # PAR SECTION, valeur provisoire — à confirmer par le gate
                                   # contre p95/coût sur c07, c10, c12 (spec §3, brique 7)
  parallelisme: 32                # appels de section simultanés (brique 12) : une seule vague pour
                                   # le plus long contrat de référence (c12 = 31 sections). Mesuré le
                                   # 22/09 sur Azure gpt-5.4 : à 4, c07 = ~30 s (8 s exigées) ; en une
                                   # vague, c07/c10/c12 = 4,8 à 5,9 s. Trafic client ~20 req/jour
                                   # (spec §4) : pas de risque de quota à ce volume. Sans effet sur un
                                   # Ollama local (OLLAMA_NUM_PARALLEL=1 sérialise, mesuré le 21/09).
  timeout_s: 20                   # brique 19 (23/09) : délai PAR appel de section. Avant : 60 s (env), sans
                                   # reprise — un appel pendu traînait toute l'analyse. Sections mesurées à 2-6 s.
  reprises: 1                     # une reprise sur délai dépassé / injoignable / 5xx / 429 — jamais sur un 4xx
  regroupement_caracteres: 4000   # sections voisines regroupées jusqu'à 4 000 caractères par appel : c01 passe
                                   # de 18 appels à ~3. On attend le plus lent des appels : moins d'appels, queue
                                   # plus courte. 0 = découpage de la brique 2 tel quel. Mesuré au gate réel (23/09).
  seuils_libelle:                 # niveau de certitude affiché au juriste (conception Ch1, H6) :
    haute: 0.8                    #   score global >= 0.8 → « haute » → valider
    moyenne: 0.5                  #   >= 0.5 → « moyenne » → vérifier les clauses sous 0.7 ; sinon « basse »
                                   # valeurs de travail, à ajuster au Chantier 2 sur les distributions observées
  calibration:                    # 24/09 : score brut -> probabilité mesurée que la clause soit juste (Platt)
    methode: platt                #   p = sigma(a * logit(score) + b) — app/pipeline/calibration.py
    a: 3.714411                   #   appris par `python -m eval.calibration ajuster` sur 431 clauses réelles (gpt-5.4) :
    b: -7.749727                  #   190 des 13 contrats étiquetés (x 2 passes) + 241 de 37 variantes « sans un article »
    points: 431                   #   (ablation : étiquette connue par construction). 13 fausses, toutes « garantie ».
    faux: 13                      #   ECE (leave-one-contract-out) 0.0262 -> 0.0004 ; Brier 0.0124 -> 0.00001
    plafond: 0.993                #   418 justes sur 418 au-dessus de 0.95 : règle de trois, jamais plus de 1 - 3/418
    ece_loco_avant: 0.026218      #   Aucune réponse entre 0.77 et 0.95 brut sur 431 : le modèle ne parle pas dans
    ece_loco_apres: 0.000428      #   cette zone (sûr et juste >= 0.95, hésitant et faux <= 0.76).
    source: eval/calibration_donnees.jsonl + eval/calibration_ablation.jsonl

schema_sortie:
  type: object
  required: [clauses]
  properties:
    clauses:
      type: array
      items:
        type: object
        required: [type, extrait, confiance]
        properties:
          type:
            type: string
            enum:
              - résiliation
              - pénalité de retard
              - confidentialité
              - propriété intellectuelle
              - limitation de responsabilité
              - force majeure
              - durée
              - prix et paiement
              - non-concurrence
              - garantie
              - données personnelles
              - droit applicable
              - exclusivité
              - reconduction tacite
          extrait:
            type: string
          confiance:
            type: number
            minimum: 0
            maximum: 1

# Brique 23 (23/09) : deux tarifs, entrée et sortie — la sortie coûte 6× l'entrée sur gpt-5.4. Valeurs = catalogue
# OpenAI relayé par la liste publique OpenRouter (https://openrouter.ai/api/v1/models, lu le 23/09), en $ / 1 000
# jetons. Le tarif Azure de la ressource du projet est normalement le même catalogue — à confirmer sur le portail.
# L'ancien tarif unique 0,002 (hérité de la v1) sous-estimait le coût d'un facteur 1,6 à 2,3 (mesuré sur c02 et c12).
cout_par_1k_entree: 0.0025
cout_par_1k_sortie: 0.015
